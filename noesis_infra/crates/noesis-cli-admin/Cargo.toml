[package]
name = "noesis-cli-admin"
version = "0.1.0"
edition = "2021"
description = "Administrative cluster control CLI, diagnostics runner, and 10,000-node topology visualizer"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
parking_lot = "0.12"
bytes = "1.6"
