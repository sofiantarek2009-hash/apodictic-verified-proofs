[package]
name = "noesis-redis-engine"
version = "0.1.0"
edition = "2021"
description = "High-performance RESP3 Redis server engine with distributed lease locks and pub/sub channels"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
bytes = "1.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
parking_lot = "0.12"
rand = "0.8"
