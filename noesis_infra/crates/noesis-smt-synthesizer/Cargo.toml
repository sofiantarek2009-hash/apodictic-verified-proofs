[package]
name = "noesis-smt-synthesizer"
version = "0.1.0"
edition = "2021"
description = "Syntax-guided automated SMT invariant synthesis (SyGuS) and counterexample-guided inductive synthesis (CEGIS) engine"

[dependencies]
bytes = "1.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
parking_lot = "0.12"
rand = "0.8"
crc32fast = "1.4"
