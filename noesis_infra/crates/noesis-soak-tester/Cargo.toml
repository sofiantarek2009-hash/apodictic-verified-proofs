[package]
name = "noesis-soak-tester"
version = "0.1.0"
edition = "2021"
description = "Multi-day soak test harness, memory leak validator, continuous invariant monitor, and long-horizon chaos engine"

[dependencies]
bytes = "1.6"
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
parking_lot = "0.12"
rand = "0.8"
crc32fast = "1.4"
