[package]
name = "noesis-security-kms"
version = "0.1.0"
edition = "2021"
description = "Hardware security module (HSM) client, envelope encryption, and AES-256-GCM data key rotation"

[dependencies]
bytes = "1.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
sha2 = "0.10"
rand = "0.8"
parking_lot = "0.12"
