[package]
name = "noesis-schema-migration"
version = "0.1.0"
edition = "2021"
description = "Declarative schema migrations, versioned dependency DAGs, online DDL table rewriting, and advisory migration locks"

[dependencies]
bytes = "1.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
sha2 = "0.10"
crc32fast = "1.4"
parking_lot = "0.12"
