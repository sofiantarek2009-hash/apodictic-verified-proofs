[package]
name = "noesis-cdc-engine"
version = "0.1.0"
edition = "2021"
description = "PostgreSQL streaming Change Data Capture (CDC) engine, pgoutput / test_decoding WAL parser, and atomic mutation dispatcher"

[dependencies]
bytes = "1.6"
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
byteorder = "1.5"
parking_lot = "0.12"
crc32fast = "1.4"
