[package]
name = "noesis-grpc-cluster"
version = "0.1.0"
edition = "2021"
description = "High-throughput gRPC HTTP/2 cluster transport and consensus replication across 10,000 nodes"

[dependencies]
bytes = "1.6"
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
parking_lot = "0.12"
crc32fast = "1.4"
rand = "0.8"
