[package]
name = "noesis-rate-limiter"
version = "0.1.0"
edition = "2021"
description = "High-throughput token bucket, sliding window log, and distributed multi-tenant rate limiting middleware"

[dependencies]
bytes = "1.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
parking_lot = "0.12"
crc32fast = "1.4"
