[package]
name = "noesis-e2e-cluster"
version = "0.1.0"
edition = "2021"
description = "End-to-end integration and cluster execution harness linking wire proxy, microVM pool, Raft consensus, and SMT verifier"

[dependencies]
bytes = "1.6"
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
parking_lot = "0.12"
rand = "0.8"
crc32fast = "1.4"
