[package]
name = "noesis-consensus-recovery"
version = "0.1.0"
edition = "2021"
description = "Consensus node recovery, segmented WAL log replay, and dynamic replica catch-up engine"

[dependencies]
bytes = "1.6"
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
parking_lot = "0.12"
crc32fast = "1.4"
sha2 = "0.10"
