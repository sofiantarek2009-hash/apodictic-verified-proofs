[package]
name = "noesis-benchmarks"
version = "0.1.0"
edition = "2021"
description = "Production multi-threaded benchmark suite simulating 50,000 concurrent sockets, TPCC workload, and p99.9 latency SLA gates"

[dependencies]
bytes = "1.6"
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
rand = "0.8"
parking_lot = "0.12"
crc32fast = "1.4"
