[package]
name = "noesis-kafka-wal"
version = "0.1.0"
edition = "2021"
description = "High-throughput append-only Kafka/Redpanda WAL log segmenter, indexer, and zero-copy consumer"

[dependencies]
bytes = "1.6"
crc32fast = "1.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
byteorder = "1.5"
