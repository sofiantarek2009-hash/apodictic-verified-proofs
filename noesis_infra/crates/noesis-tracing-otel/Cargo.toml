[package]
name = "noesis-tracing-otel"
version = "0.1.0"
edition = "2021"
description = "W3C TraceContext distributed tracer, tail-based sampler, and OpenTelemetry OTLP span exporter"

[dependencies]
bytes = "1.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
rand = "0.8"
parking_lot = "0.12"
crc32fast = "1.4"
