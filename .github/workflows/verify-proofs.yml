name: Verify All Standalone Z3, Odoo-ETA, SDK & MCP Proofs
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      - name: Run all 9 Gist Z3 & Odoo-ETA proof bundles
        run: |
          set -e
          for f in gists/*/*.py; do
            echo "=== Running $f ==="
            python3 "$f"
          done
      - name: Run @apodictic/sdk production Z3, crash-durability & 20x concurrency tests
        run: node packages/apodictic-sdk/test.mjs
      - name: Run @apodictic/mcp-verifier production stdio proxy & serve tests
        run: node packages/apodictic-mcp-verifier/test.mjs
