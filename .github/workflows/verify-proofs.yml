name: Verify Public Z3 Proofs & Standalone Harness
on: [push, pull_request, workflow_dispatch]
jobs:
  verify-public-proofs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      - name: Run all 9 standalone Z3 & Odoo-ETA proof bundles
        run: |
          set -e
          for f in gists/*/*.py; do
            echo "=== Running $f ==="
            python3 "$f"
          done
      - name: Verify @apodictic/sdk & @apodictic/mcp-verifier packaging
        run: |
          (cd packages/apodictic-sdk && npm pack --dry-run)
          (cd packages/apodictic-mcp-verifier && npm pack --dry-run)
