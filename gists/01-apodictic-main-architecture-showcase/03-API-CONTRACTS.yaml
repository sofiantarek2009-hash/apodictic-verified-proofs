openapi: 3.1.0
info:
  title: Apodictic Enterprise Pre-Execution Verification & Sovereign Proof API
  version: "2026.4.1"
  description: >
    Live Next.js App Router API contracts backed by Microsoft Z3 5.4.1, ZeroPIIGateway,
    SEC 17a-4 WORM hash chains, SQL:2011 Bi-Temporal Accounting, and Merkle-Patricia proofs.
paths:
  /api/apodictic/verify:
    post:
      summary: Formal Z3 SMT Pre-Commit Verification & Zero-PII Sanitization Gate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                payload:
                  type: string
                  example: "POST account.move supplier=cairo_medical@vendor.eg tax=ETA-301994821 amount=42000"
                action:
                  type: string
                  example: "POST_JOURNAL"
                amount:
                  type: number
                  example: 42000
                currentBalance:
                  type: number
                  example: 185000
                minReserve:
                  type: number
                  example: 25000
                maxAutonomousLimit:
                  type: number
                  example: 50000
                cfoApproved:
                  type: boolean
                  example: false
                compensatingReversal:
                  type: boolean
                  example: false
                vatRate:
                  type: number
                  example: 0.14
                expectedVatRate:
                  type: number
                  example: 0.14
                targetSystem:
                  type: string
                  enum: [odoo_v18, odoo_v19, odoo_v20, postgresql_wal, stripe, netsuite]
                executionDag:
                  type: array
                  items:
                    type: object
                    properties:
                      stepId: { type: string }
                      action: { type: string }
                      targetSystem: { type: string }
                      amount: { type: number }
      responses:
        "200":
          description: Formal SAT/UNSAT verification verdict with SMT-LIB2 formula, invariants, counterexample, counterfactual patch, and rollback/audit handles
          content:
            application/json:
              schema:
                type: object
                properties:
                  verdict: { type: string, enum: [SAT, UNSAT] }
                  verified: { type: boolean }
                  engine: { type: string, example: "z3-5.4.1-smt" }
                  ast_engine: { type: string, example: "sqlglot-postgres" }
                  execution_time_ms: { type: number }
                  z3_solve_ms: { type: number }
                  filter_latency_ms: { type: number }
                  simd_latency_ms: { type: number }
                  tokenized_payload: { type: string }
                  symbol_map: { type: array, items: { type: object } }
                  pii_entities_redacted: { type: integer }
                  violations: { type: array, items: { type: string } }
                  invariants:
                    type: object
                    properties:
                      INV_LIQUIDITY_FLOOR: { type: boolean }
                      INV_NON_NEGATIVE: { type: boolean }
                      INV_AUTONOMOUS_CAP: { type: boolean }
                      INV_ATOMIC_REVERSAL: { type: boolean }
                      INV_STATUTORY_VAT: { type: boolean }
                  unsat_core: { type: array, items: { type: string } }
                  counterexample:
                    type: object
                    properties:
                      post_balance: { type: number }
                      required_min_reserve: { type: number }
                      liquidity_shortfall: { type: number }
                      uncompensated_destructive_action: { type: ["string", "null"] }
                  counterfactual_patch:
                    type: ["object", "null"]
                    description: Z3-synthesized minimal corrective delta when verdict is UNSAT
                  compensating_sql_diff: { type: string }
                  smt_formula: { type: string }
                  proof_hash: { type: string }
                  is_destructive: { type: boolean }
                  rollback_connector:
                    type: object
                    properties:
                      system: { type: string }
                      operation: { type: string }
                      compensable: { type: boolean }
                      dispatch_ms: { type: number }
                      checkpoint_id: { type: string }
                      mode: { type: string }
                  rollbackBatchId: { type: ["string", "null"] }
                  auditBlock:
                    type: ["object", "null"]
                    properties:
                      block_index: { type: integer }
                      entry_hash: { type: string }

  /api/apodictic/deidentify:
    post:
      summary: Deterministic Bijective Zero-PII & Secret Sanitization Gateway
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string }
      responses:
        "200":
          description: Sanitized payload with bijective symbol map and sub-millisecond timing
          content:
            application/json:
              schema:
                type: object
                properties:
                  deidentified_text: { type: string }
                  symbol_map: { type: array, items: { type: object } }
                  pii_count: { type: integer }
                  bytes_removed: { type: integer }
                  latency_ms: { type: number }

  /api/apodictic/worm-vault:
    get:
      summary: Inspect latest SEC 17a-4 WORM chain records and integrity verification status
      responses:
        "200":
          description: Chain height, cryptographic integrity verdict, and recent sealed blocks
    post:
      summary: Append, cryptographically verify, or list SEC 17a-4 WORM chain blocks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [append, verify, list] }
                payload: { type: string }
                metadata: { type: object }

  /api/apodictic/time-travel:
    post:
      summary: SQL:2011 Bi-Temporal Point-in-Time Accounting Query
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action: { type: string, enum: [query], default: query }
                entity_id: { type: string, example: "ACC-ALPHA" }
                valid_time: { type: integer, example: 2500 }
                system_time: { type: integer, example: 2000 }

  /api/apodictic/proof-transcript:
    get:
      summary: Execute live Z3 5.4.1 verification harness and emit signed SHA-256 transcript
      responses:
        "200":
          description: Tamper-evident JSON execution transcript across all verification subsystems
          headers:
            X-Apodictic-Master-SHA256:
              schema: { type: string }
            X-Apodictic-Z3-Version:
              schema: { type: string, example: "5.4.1" }
