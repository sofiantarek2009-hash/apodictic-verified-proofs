openapi: 3.1.0
info:
  title: Noesis AI Enterprise Pre-Execution Verification & Sovereign Proof API
  version: "2026.4.1"
  description: >
    Live Next.js App Router API contracts backed by Microsoft Z3 5.4.1, ZeroPIIGateway,
    SEC 17a-4 WORM hash chains, SQL:2011 Bi-Temporal Accounting, and Merkle-Patricia proofs.
paths:
  /api/noesis/verify:
    post:
      summary: Formal Z3 SMT Pre-Commit Verification & Zero-PII Sanitization Gate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                payload:
                  type: string
                  example: "POST account.move supplier=cairo_medical@vendor.eg tax=ETA-301994821 amount=42000"
                action:
                  type: string
                  example: "POST_JOURNAL"
                amount:
                  type: number
                  example: 42000
                currentBalance:
                  type: number
                  example: 185000
                minReserve:
                  type: number
                  example: 25000
                maxAutonomousLimit:
                  type: number
                  example: 50000
                cfoApproved:
                  type: boolean
                  example: false
                compensatingReversal:
                  type: boolean
                  example: false
                vatRate:
                  type: number
                  example: 0.14
                expectedVatRate:
                  type: number
                  example: 0.14
                targetSystem:
                  type: string
                  enum: [odoo_v18, postgresql_wal]
                executionDag:
                  type: array
                  items:
                    type: object
                    properties:
                      name: { type: string }
                      amount: { type: number }
      responses:
        "200":
          description: Formal SAT/UNSAT verification verdict with SMT-LIB2 formula, counterexample, and rollback handle
          content:
            application/json:
              schema:
                type: object
                properties:
                  verdict: { type: string, enum: [SAT, UNSAT] }
                  verified: { type: boolean }
                  engine: { type: string, example: "z3-5.4.1-smt" }
                  execution_time_ms: { type: number }
                  z3_solve_ms: { type: number }
                  filter_latency_ms: { type: number }
                  tokenized_payload: { type: string }
                  pii_entities_redacted: { type: integer }
                  violations: { type: array, items: { type: string } }
                  smt_formula: { type: string }
                  proof_hash: { type: string }
                  compensating_sql_diff: { type: string }
                  rollback_connector:
                    type: object
                    properties:
                      system: { type: string }
                      operation: { type: string }
                      compensable: { type: boolean }
                      dispatch_ms: { type: number }
                      checkpoint_id: { type: string }

  /api/noesis/deidentify:
    post:
      summary: Deterministic Bijective Zero-PII & Secret Sanitization Gateway
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string }
      responses:
        "200":
          description: Sanitized payload with bijective symbol map and sub-millisecond timing
          content:
            application/json:
              schema:
                type: object
                properties:
                  deidentified_text: { type: string }
                  symbol_map: { type: array, items: { type: object } }
                  pii_count: { type: integer }
                  bytes_removed: { type: integer }
                  latency_ms: { type: number }

  /api/noesis/worm-vault:
    get:
      summary: Inspect latest SEC 17a-4 WORM chain records and integrity verification status
      responses:
        "200":
          description: Chain height, cryptographic integrity verdict, and recent sealed blocks
    post:
      summary: Append, cryptographically verify, or list SEC 17a-4 WORM chain blocks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [append, verify, list] }
                payload: { type: string }
                metadata: { type: object }

  /api/noesis/time-travel:
    post:
      summary: SQL:2011 Bi-Temporal Point-in-Time Accounting Query
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action: { type: string, enum: [query], default: query }
                entity_id: { type: string, example: "ACC-ALPHA" }
                valid_time: { type: integer, example: 2500 }
                system_time: { type: integer, example: 2000 }

  /api/noesis/proof-transcript:
    get:
      summary: Execute live Z3 5.4.1 6-subsystem verification harness and emit signed SHA-256 transcript
      responses:
        "200":
          description: Tamper-evident JSON execution transcript across all deep moats
          headers:
            X-Noesis-Master-SHA256:
              schema: { type: string }
            X-Noesis-Z3-Version:
              schema: { type: string, example: "5.4.1" }
